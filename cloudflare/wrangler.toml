# The Braid-HTTP polyfill as a Cloudflare Worker.  Set ORIGIN to your
# origin, then `npx wrangler deploy`.  The name is the worker's name in
# your account, and the workers.dev address it gets; to serve your own
# hostname instead, add a custom domain or a route (see readme.md).
name = "braid-cloudflare"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# The origin the polyfill stands in front of.  Leave it unset to serve
# a route in your own zone, where the request's own host is the origin.
ORIGIN = "https://origin.example.com"
# Seconds a regional object keeps a subscription to the origin open
# after its last reader has gone
IDLE_SECONDS = "60"
# Seconds a data center keeps a subscription of its own after a plain
# GET, so that the copy it stored stays current for the next reader;
# "0" turns this off
POST_GET_SUBSCRIPTION_SECONDS = "30"
# Objects per site per reader's region ("reader"), or all in one region
# named by its Durable Object location hint: wnam, enam, weur, eeur,
# apac or oc
REGIONS = "reader"
# How regions reach the origin: "flat", each region subscribes itself
MODE = "flat"
# Whether the origin sends 104 Origin Status; until it does, the object
# takes the origin's sub-responses as current on arrival
ORIGIN_SENDS_STATUS = "false"
# Whether readers get 104 Origin Status sub-responses ("true" unless set
# to "false").  A client that hands every sub-response to its application
# breaks on one it does not expect; braid-http filters 1xx from the update
# callback from the version after 1.5.1.  The polyfill's own keepers get
# them regardless.
READER_STATUS = "true"

[[durable_objects.bindings]]
name = "BRAID_RESOURCE"
class_name = "BraidResource"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BraidResource"]

[observability]
enabled = true

# A Worker streaming a subscription accrues CPU for as long as the stream
# lasts, a fraction of a millisecond per heartbeat and per cache renewal.
# The Paid plan's default of 30 s is about a day of streaming; this is the
# maximum.  The Free plan's 10 ms ends a stream within a minute.
[limits]
cpu_ms = 300000
