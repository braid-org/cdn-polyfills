<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake News</title>
<meta name="version" content="{{version}}">
<meta name="edited-at" content="{{edited_at}}">
<style>
  body { margin: 0; padding-bottom: 40px; font-family: Georgia, 'Times New Roman', serif; color: #111; background: #f7f5f0; }
  #masthead { text-align: center; padding: 28px 16px 10px; margin: 0 16px; border-bottom: 4px double #111; }
  #masthead h1 { font-size: 64px; margin: 0; letter-spacing: 3px; font-variant: small-caps; font-weight: 900; }
  #masthead h1 a { color: inherit; text-decoration: none; }
  #masthead .tagline { font-style: italic; color: #555; margin: 4px 0 10px; }
  #masthead .dateline { display: flex; justify-content: space-between; font: 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 1px; color: #555; border-top: 1px solid #111; padding-top: 6px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
  .breaking { background: #b3001b; color: #fff; padding: 18px 22px; margin-bottom: 28px; }
  .breaking .label { font: bold 13px system-ui, sans-serif; letter-spacing: 3px; }
  .breaking h2 { font-size: 36px; line-height: 1.1; margin: 6px 0 8px; }
  .breaking .byline { color: #fdd; }
  .breaking .dek { color: #fee; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; }
  article.lead { grid-column: 1 / -1; border-bottom: 1px solid #ccc; padding-bottom: 20px; }
  article.lead h2 { font-size: 40px; }
  article.lead .body { columns: 2; column-gap: 32px; }
  article h2 { font-size: 26px; line-height: 1.15; margin: 0 0 6px; }
  .byline { font: 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 4px; }
  .dek { font-style: italic; color: #444; margin: 0 0 8px; }
  .body p { line-height: 1.5; margin: 0 0 12px; }
  .empty { text-align: center; color: #666; font-style: italic; padding: 60px 0; }
  #status { position: fixed; bottom: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px 24px; padding: 7px 16px; background: #111; color: #ccc; font: 12px system-ui, sans-serif; }
  #status b { color: #fff; font-weight: 600; }
  #status .online { color: #5c5; }
  #status .offline { color: #e55; }
  @media (max-width: 600px) { #masthead h1 { font-size: 40px; } .breaking h2, article.lead h2 { font-size: 28px; } article.lead .body { columns: 1; } }
</style>
</head>
<body>
<header id="masthead">
  <h1><a href="/">Fake News</a></h1>
  <div class="tagline">All the news that's fit to fake</div>
  <div class="dateline"><span>{{dateline}}</span><span>fake.braid.news</span><span>Edition No. {{version}}</span></div>
</header>
<main id="content">
{{content}}
</main>
<footer id="status"></footer>
<script src="/braid-http-client.js"></script>
<script>
// Subscribes to this page's own URL and swaps in each pushed edition, then
// reports in the footer: edition, connection state, edit-to-screen delay,
// and which server or CDN node answered.  The delay compares the server's
// publish time against this browser's clock, so it is only meaningful when
// the two clocks agree.
(function () {
    var meta = name => document.querySelector('meta[name="' + name + '"]')?.content
    var version = meta('version'),
        edited_at = +meta('edited-at'),
        online = false,
        latency = null,
        page_from = meta('served-by') || 'origin',
        served_by = '…'

    function render_status () {
        var age = Math.round((Date.now() - edited_at) / 1000)
        document.getElementById('status').innerHTML =
            (online ? '<span class="online">&#9679; live</span>' : '<span class="offline">&#9675; reconnecting</span>')
            + '<span>Edition <b>' + version + '</b></span>'
            + '<span>published <b>' + new Date(edited_at).toLocaleTimeString() + '</b> (' + age + ' s ago)</span>'
            + '<span>edit to screen: <b>' + (latency === null ? '—' : latency + ' ms') + '</b></span>'
            + '<span>page from <b>' + page_from + '</b></span>'
            + '<span>updates via <b>' + served_by + '</b></span>'
    }
    setInterval(render_status, 1000)
    render_status()

    // Which node answered, from headers the CDNs add.  Same-origin fetches
    // expose every response header.
    function node_name (headers) {
        var ray = headers.get('cf-ray')            // Cloudflare: <id>-<airport code>
        if (ray) return 'Cloudflare ' + ray.split('-')[1]
        var fastly = headers.get('x-served-by')    // Fastly: cache-<node>
        if (fastly) return 'Fastly ' + fastly
        var server = headers.get('server') || ''   // Bunny: BunnyCDN-<node>
        if (/bunny/i.test(server)) return server
        return 'origin'
    }

    braid_fetch(location.pathname, {
        subscribe: true,
        retry: true,
        heartbeats: 20,
        parents: () => [version],
        onSubscriptionStatus: status => { online = status.online; render_status() }
    }).then(res => {
        served_by = node_name(res.headers)
        render_status()
        res.subscribe(update => {
            var doc = new DOMParser().parseFromString(update.body_text, 'text/html')
            document.getElementById('masthead').replaceWith(doc.getElementById('masthead'))
            document.getElementById('content').replaceWith(doc.getElementById('content'))
            version = update.version[0]
            edited_at = +doc.querySelector('meta[name="edited-at"]').content
            latency = Date.now() - edited_at
            render_status()
        })
    })
})()
</script>
</body>
</html>
